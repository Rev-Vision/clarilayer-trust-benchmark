# ClariLayer Trust Benchmark - Baseline C (Cube.dev semantic layer)
# Metric: gross_margin (Gross Margin)
# Generated by harness/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into Cube measure: B - '(Revenue - 25% COGS) / Revenue, raw invoices (no test exclusion)'
# Note: ONE canonical definition per measure. NO governance metadata,
# NO versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the strongest non-ClariLayer prior art surface.
# Time grains: day, week, month, quarter, year (Cube.dev default; no fiscal calendar).
cubes:
- name: customers
  sql_table: dim_customers
  dimensions:
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
    primary_key: true
  - name: company_name
    sql: '{CUBE}.company_name'
    type: string
  - name: industry
    sql: '{CUBE}.industry'
    type: string
  - name: plan_tier
    sql: '{CUBE}.plan_tier'
    type: string
  - name: country
    sql: '{CUBE}.country'
    type: string
  - name: is_test
    sql: '{CUBE}.is_test'
    type: boolean
  - name: signup_date
    sql: '{CUBE}.signup_date'
    type: time
  - name: churned_at
    sql: '{CUBE}.churned_at'
    type: time
  measures:
  - name: count
    type: count
    sql: '*'
- name: subscriptions
  sql_table: fct_subscriptions
  joins:
  - name: customers
    sql: '{CUBE}.customer_id = {customers}.customer_id'
    relationship: many_to_one
  dimensions:
  - name: sub_id
    sql: '{CUBE}.sub_id'
    type: string
    primary_key: true
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: plan
    sql: '{CUBE}.plan'
    type: string
  - name: status
    sql: '{CUBE}.status'
    type: string
  - name: started_at
    sql: '{CUBE}.started_at'
    type: time
  - name: ended_at
    sql: '{CUBE}.ended_at'
    type: time
  - name: mrr
    sql: '{CUBE}.mrr'
    type: number
  measures:
  - name: count
    type: count
    sql: '*'
- name: invoices
  sql_table: fct_invoices
  joins:
  - name: customers
    sql: '{CUBE}.customer_id = {customers}.customer_id'
    relationship: many_to_one
  dimensions:
  - name: invoice_id
    sql: '{CUBE}.invoice_id'
    type: string
    primary_key: true
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: status
    sql: '{CUBE}.status'
    type: string
  - name: processor
    sql: '{CUBE}.processor'
    type: string
  - name: paid_at
    sql: '{CUBE}.paid_at'
    type: time
  - name: due_at
    sql: '{CUBE}.due_at'
    type: time
  - name: amount
    sql: '{CUBE}.amount'
    type: number
  measures:
  - name: gross_margin_pct
    type: number
    description: Revenue minus 25% COGS placeholder over paid invoices. No is_test exclusion. Variant
      B in the D2 catalog.
    sql: (SUM({CUBE}.amount) - SUM({CUBE}.amount) * 0.25) / NULLIF(SUM({CUBE}.amount), 0) * 100
    filters:
    - sql: '{CUBE}.status = ''paid'''
  - name: count
    type: count
    sql: '*'
- name: cogs
  sql_table: fct_cogs
  dimensions:
  - name: source
    sql: '{CUBE}.source'
    type: string
  - name: period_month
    sql: '{CUBE}.period_month'
    type: time
  - name: amount
    sql: '{CUBE}.amount'
    type: number
  measures:
  - name: count
    type: count
    sql: '*'
