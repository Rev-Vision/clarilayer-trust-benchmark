# ClariLayer Trust Benchmark - Baseline C (Cube.dev semantic layer)
# Metric: net_retention (Net Revenue Retention (NRR))
# Generated by harness/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into Cube measure: A - '(Starting ARR + expansion - contraction - churn) / Starting ARR'
# Note: ONE canonical definition per measure. NO governance metadata,
# NO versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the strongest non-ClariLayer prior art surface.
# Time grains: day, week, month, quarter, year (Cube.dev default; no fiscal calendar).
cubes:
- name: customers
  sql_table: dim_customers
  dimensions:
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
    primary_key: true
  - name: company_name
    sql: '{CUBE}.company_name'
    type: string
  - name: industry
    sql: '{CUBE}.industry'
    type: string
  - name: plan_tier
    sql: '{CUBE}.plan_tier'
    type: string
  - name: country
    sql: '{CUBE}.country'
    type: string
  - name: is_test
    sql: '{CUBE}.is_test'
    type: boolean
  - name: signup_date
    sql: '{CUBE}.signup_date'
    type: time
  - name: churned_at
    sql: '{CUBE}.churned_at'
    type: time
  measures:
  - name: count
    type: count
    sql: '*'
- name: subscriptions
  sql_table: fct_subscriptions
  joins:
  - name: customers
    sql: '{CUBE}.customer_id = {customers}.customer_id'
    relationship: many_to_one
  dimensions:
  - name: sub_id
    sql: '{CUBE}.sub_id'
    type: string
    primary_key: true
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: plan
    sql: '{CUBE}.plan'
    type: string
  - name: status
    sql: '{CUBE}.status'
    type: string
  - name: started_at
    sql: '{CUBE}.started_at'
    type: time
  - name: ended_at
    sql: '{CUBE}.ended_at'
    type: time
  - name: mrr
    sql: '{CUBE}.mrr'
    type: number
  measures:
  - name: net_retention
    type: number
    description: Active-MRR share of total MRR. Coarse Cube approximation of NRR variant A — no per-customer
      cohorting, no start/end period anchors.
    sql: 1.0 * SUM(CASE WHEN {CUBE}.status = 'active' THEN {CUBE}.mrr ELSE 0 END) / NULLIF(SUM({CUBE}.mrr),
      0)
  - name: count
    type: count
    sql: '*'
