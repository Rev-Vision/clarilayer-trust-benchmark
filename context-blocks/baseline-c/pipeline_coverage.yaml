# ClariLayer Trust Benchmark - Baseline C (Cube.dev semantic layer)
# Metric: pipeline_coverage (Pipeline Coverage)
# Generated by harness/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into Cube measure: A - 'Sum of all opp deal values / target'
# Note: ONE canonical definition per measure. NO governance metadata,
# NO versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the strongest non-ClariLayer prior art surface.
# Time grains: day, week, month, quarter, year (Cube.dev default; no fiscal calendar).
cubes:
- name: events
  sql_table: fct_events
  dimensions:
  - name: event_id
    sql: '{CUBE}.event_id'
    type: string
    primary_key: true
  - name: user_id
    sql: '{CUBE}.user_id'
    type: string
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: event_type
    sql: '{CUBE}.event_type'
    type: string
  - name: timezone
    sql: '{CUBE}.timezone'
    type: string
  - name: timestamp
    sql: '{CUBE}."timestamp"'
    type: time
  - name: inserted_at
    sql: '{CUBE}.inserted_at'
    type: time
  measures:
  - name: pipeline_coverage
    type: number
    description: All opp_created deal values divided by $5M target. No open-status NOT EXISTS filter,
      no JSON-path coalesce — a competent Cube author would not catch the camelCase form.
    sql: SUM(CAST({CUBE}.properties_jsonb->>'deal_value' AS numeric)) / 5000000.0
    filters:
    - sql: '{CUBE}.event_type = ''opp_created'''
  - name: count
    type: count
    sql: '*'
