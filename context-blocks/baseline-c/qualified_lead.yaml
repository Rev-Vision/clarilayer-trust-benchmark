# ClariLayer Trust Benchmark - Baseline C (Cube.dev semantic layer)
# Metric: qualified_lead (Qualified Lead)
# Generated by harness/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into Cube measure: A (approximated) - 'Distinct users created in window (event requirement omitted)'
# Cube cannot natively express NOT EXISTS / event-count gate via a
# JOIN-based measure; this approximation drops the event existence filter,
# which is itself the kind of gap a competent semantic-layer engineer ships
# without governance context.
# Note: ONE canonical definition per measure. NO governance metadata,
# NO versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the strongest non-ClariLayer prior art surface.
# Time grains: day, week, month, quarter, year (Cube.dev default; no fiscal calendar).
cubes:
- name: customers
  sql_table: dim_customers
  dimensions:
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
    primary_key: true
  - name: company_name
    sql: '{CUBE}.company_name'
    type: string
  - name: industry
    sql: '{CUBE}.industry'
    type: string
  - name: plan_tier
    sql: '{CUBE}.plan_tier'
    type: string
  - name: country
    sql: '{CUBE}.country'
    type: string
  - name: is_test
    sql: '{CUBE}.is_test'
    type: boolean
  - name: signup_date
    sql: '{CUBE}.signup_date'
    type: time
  - name: churned_at
    sql: '{CUBE}.churned_at'
    type: time
  measures:
  - name: count
    type: count
    sql: '*'
- name: users
  sql_table: dim_users
  joins:
  - name: customers
    sql: '{CUBE}.customer_id = {customers}.customer_id'
    relationship: many_to_one
  dimensions:
  - name: user_id
    sql: '{CUBE}.user_id'
    type: string
    primary_key: true
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: email
    sql: '{CUBE}.email'
    type: string
  - name: role
    sql: '{CUBE}.role'
    type: string
  - name: created_at
    sql: '{CUBE}.created_at'
    type: time
  - name: last_active_at
    sql: '{CUBE}.last_active_at'
    type: time
  - name: deleted_at
    sql: '{CUBE}.deleted_at'
    type: time
  measures:
  - name: qualified_leads
    type: count_distinct
    description: Distinct users created in window. No engagement-threshold or industry filter — those
      are too complex for a single Cube measure.
    sql: '{CUBE}.user_id'
  - name: count
    type: count
    sql: '*'
- name: events
  sql_table: fct_events
  joins:
  - name: users
    sql: '{CUBE}.user_id = {users}.user_id'
    relationship: many_to_one
  - name: customers
    sql: '{CUBE}.customer_id = {customers}.customer_id'
    relationship: many_to_one
  dimensions:
  - name: event_id
    sql: '{CUBE}.event_id'
    type: string
    primary_key: true
  - name: user_id
    sql: '{CUBE}.user_id'
    type: string
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: event_type
    sql: '{CUBE}.event_type'
    type: string
  - name: timezone
    sql: '{CUBE}.timezone'
    type: string
  - name: timestamp
    sql: '{CUBE}."timestamp"'
    type: time
  - name: inserted_at
    sql: '{CUBE}.inserted_at'
    type: time
  measures:
  - name: count
    type: count
    sql: '*'
