# ClariLayer Trust Benchmark - Baseline C (Cube.dev semantic layer)
# Metric: win_rate (Win Rate)
# Generated by harness/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into Cube measure: B - 'won / (won + lost + no_decision)'
# Note: ONE canonical definition per measure. NO governance metadata,
# NO versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the strongest non-ClariLayer prior art surface.
# Time grains: day, week, month, quarter, year (Cube.dev default; no fiscal calendar).
cubes:
- name: events
  sql_table: fct_events
  dimensions:
  - name: event_id
    sql: '{CUBE}.event_id'
    type: string
    primary_key: true
  - name: user_id
    sql: '{CUBE}.user_id'
    type: string
  - name: customer_id
    sql: '{CUBE}.customer_id'
    type: string
  - name: event_type
    sql: '{CUBE}.event_type'
    type: string
  - name: timezone
    sql: '{CUBE}.timezone'
    type: string
  - name: timestamp
    sql: '{CUBE}."timestamp"'
    type: time
  - name: inserted_at
    sql: '{CUBE}.inserted_at'
    type: time
  measures:
  - name: win_rate
    type: number
    description: Won events divided by (won + lost + no_decision). Includes no_decision — variant B's
      trap (governed variant A excludes it).
    sql: 1.0 * COUNT(CASE WHEN {CUBE}.event_type = 'opp_won' THEN 1 END) / NULLIF(COUNT(CASE WHEN {CUBE}.event_type
      IN ('opp_won', 'opp_lost', 'opp_no_decision') THEN 1 END), 0)
  - name: count
    type: count
    sql: '*'
