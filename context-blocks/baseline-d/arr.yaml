# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: arr (Annual Recurring Revenue (ARR))
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: A - "SUM(mrr) * 12 where status = 'active'"
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: customers
  description: Customer dimension — one row per customer account, including company metadata, signup,
    churn, and test flag.
  model: stg_customers
  defaults:
    agg_time_dimension: signup_date
  entities:
  - name: customer
    type: primary
    expr: customer_id
    description: Canonical customer entity.
  dimensions:
  - name: company_name
    type: categorical
    expr: company_name
    description: Account display name.
  - name: industry
    type: categorical
    expr: industry
    description: Customer industry vertical (free-text taxonomy).
  - name: plan_tier
    type: categorical
    expr: plan_tier
    description: Subscription plan tier on the customer record (Starter / Pro / Enterprise).
  - name: country
    type: categorical
    expr: country
    description: Customer billing country (ISO-style display value).
  - name: is_test
    type: categorical
    expr: is_test
    description: True for internal / QA accounts that should be excluded from financial roll-ups.
  - name: signup_date
    type: time
    expr: signup_date
    description: Date the customer first signed up.
    type_params:
      time_granularity: day
  - name: churned_at
    type: time
    expr: churned_at
    description: Timestamp the customer churned (NULL if still active).
    type_params:
      time_granularity: day
  measures:
  - name: customer_count
    agg: count_distinct
    expr: customer_id
    description: Distinct customer_id count.
  - name: first_signup_date
    agg: min
    expr: signup_date
    description: Earliest signup_date in the slice.
    agg_time_dimension: signup_date
  - name: last_signup_date
    agg: max
    expr: signup_date
    description: Latest signup_date in the slice.
    agg_time_dimension: signup_date
- name: subscriptions
  description: Subscription fact — one row per subscription term with plan, MRR, status, and lifecycle
    timestamps.
  model: stg_subscriptions
  defaults:
    agg_time_dimension: started_at
  entities:
  - name: subscription
    type: primary
    expr: sub_id
    description: Canonical subscription-term entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: plan
    type: categorical
    expr: plan
    description: Subscription plan name.
  - name: status
    type: categorical
    expr: status
    description: Subscription status (active / cancelled / paused / trial).
  - name: started_at
    type: time
    expr: started_at
    description: Timestamp the subscription term began.
    type_params:
      time_granularity: day
  - name: ended_at
    type: time
    expr: ended_at
    description: Timestamp the subscription term ended (NULL if open).
    type_params:
      time_granularity: day
  measures:
  - name: arr_mrr_sum
    description: SUM(mrr) on active subscriptions; the metric annualizes 12x.
    agg: sum
    expr: mrr
  - name: total_mrr
    agg: sum
    expr: mrr
    description: Unfiltered SUM(mrr); compose with a status / is_test filter at the metric layer when
      scoping is required.
  - name: avg_mrr
    agg: average
    expr: mrr
    description: AVG(mrr) over the slice.
  - name: first_started_at
    agg: min
    expr: started_at
    description: Earliest subscription started_at.
    agg_time_dimension: started_at
  - name: last_started_at
    agg: max
    expr: started_at
    description: Latest subscription started_at.
    agg_time_dimension: started_at
- name: invoices
  description: Invoice fact — one row per invoice with amount, status, and processor lineage.
  model: stg_invoices
  defaults:
    agg_time_dimension: paid_at
  entities:
  - name: invoice
    type: primary
    expr: invoice_id
    description: Canonical invoice entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: status
    type: categorical
    expr: status
    description: Invoice status (paid / unpaid / void / refunded).
  - name: processor
    type: categorical
    expr: processor
    description: Payment processor (stripe / legacy_braintree).
  - name: paid_at
    type: time
    expr: paid_at
    description: Timestamp the invoice was paid (NULL if unpaid). Available granularities include the
      fiscal_month custom grain declared on the time spine.
    type_params:
      time_granularity: day
  - name: due_at
    type: time
    expr: due_at
    description: Invoice due date.
    type_params:
      time_granularity: day
  measures:
  - name: total_amount
    agg: sum
    expr: amount
    description: Unfiltered SUM(amount); compose with status='paid' for revenue views.
  - name: avg_invoice_amount
    agg: average
    expr: amount
    description: AVG(amount) over the slice.
metrics:
- name: arr
  label: Annual Recurring Revenue (ARR)
  description: Annualized run-rate from active subscriptions. No is_test / churned / negative-MRR filters
    — that's the governance gap.
  type: derived
  type_params:
    expr: arr_mrr_sum * 12
    metrics:
    - name: arr_mrr_sum
      filter: '{{ Dimension(''subscription__status'') }} = ''active'''
- name: arr_mrr_sum
  label: Arr Mrr Sum
  description: Building-block metric for arr derived expression.
  type: simple
  type_params:
    measure:
      name: arr_mrr_sum
      filter: '{{ Dimension(''subscription__status'') }} = ''active'''
saved_queries:
- name: arr_monthly_rollup
  description: Monthly ARR rollup partitioned by customer industry and plan tier.
  query_params:
    metrics:
    - arr
    group_by:
    - TimeDimension('subscription__started_at', 'month')
    - Dimension('customer__industry')
    - Dimension('customer__plan_tier')
