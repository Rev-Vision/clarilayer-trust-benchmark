# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: churn_rate (Churn Rate)
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: B - 'Revenue churn — ARR lost / ARR at period start'
# MetricFlow cannot elegantly compute 'ARR at period start' in a single
# ratio metric; the simplest reading of variant B is cancelled-MRR over
# total MRR. Period-anchored cohort denominators stay an authored gap.
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: customers
  description: Customer dimension — one row per customer account, including company metadata, signup,
    churn, and test flag.
  model: stg_customers
  defaults:
    agg_time_dimension: signup_date
  entities:
  - name: customer
    type: primary
    expr: customer_id
    description: Canonical customer entity.
  dimensions:
  - name: company_name
    type: categorical
    expr: company_name
    description: Account display name.
  - name: industry
    type: categorical
    expr: industry
    description: Customer industry vertical (free-text taxonomy).
  - name: plan_tier
    type: categorical
    expr: plan_tier
    description: Subscription plan tier on the customer record (Starter / Pro / Enterprise).
  - name: country
    type: categorical
    expr: country
    description: Customer billing country (ISO-style display value).
  - name: is_test
    type: categorical
    expr: is_test
    description: True for internal / QA accounts that should be excluded from financial roll-ups.
  - name: signup_date
    type: time
    expr: signup_date
    description: Date the customer first signed up.
    type_params:
      time_granularity: day
  - name: churned_at
    type: time
    expr: churned_at
    description: Timestamp the customer churned (NULL if still active).
    type_params:
      time_granularity: day
  measures:
  - name: customer_count
    agg: count_distinct
    expr: customer_id
    description: Distinct customer_id count.
  - name: first_signup_date
    agg: min
    expr: signup_date
    description: Earliest signup_date in the slice.
    agg_time_dimension: signup_date
  - name: last_signup_date
    agg: max
    expr: signup_date
    description: Latest signup_date in the slice.
    agg_time_dimension: signup_date
- name: subscriptions
  description: Subscription fact — one row per subscription term with plan, MRR, status, and lifecycle
    timestamps.
  model: stg_subscriptions
  defaults:
    agg_time_dimension: started_at
  entities:
  - name: subscription
    type: primary
    expr: sub_id
    description: Canonical subscription-term entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: plan
    type: categorical
    expr: plan
    description: Subscription plan name.
  - name: status
    type: categorical
    expr: status
    description: Subscription status (active / cancelled / paused / trial).
  - name: started_at
    type: time
    expr: started_at
    description: Timestamp the subscription term began.
    type_params:
      time_granularity: day
  - name: ended_at
    type: time
    expr: ended_at
    description: Timestamp the subscription term ended (NULL if open).
    type_params:
      time_granularity: day
  measures:
  - name: cancelled_mrr_sum
    description: SUM(mrr) on cancelled subscriptions in the slice; anchored on ended_at so the time slice
      tracks cancellations rather than original term starts.
    agg: sum
    expr: mrr
    agg_time_dimension: ended_at
  - name: all_subscription_mrr_sum
    description: SUM(mrr) across all subscription rows (no filter); anchored on ended_at to align with
      cancelled_mrr_sum in the ratio.
    agg: sum
    expr: mrr
    agg_time_dimension: ended_at
  - name: total_mrr
    agg: sum
    expr: mrr
    description: Unfiltered SUM(mrr); compose with a status / is_test filter at the metric layer when
      scoping is required.
  - name: avg_mrr
    agg: average
    expr: mrr
    description: AVG(mrr) over the slice.
  - name: first_started_at
    agg: min
    expr: started_at
    description: Earliest subscription started_at.
    agg_time_dimension: started_at
  - name: last_started_at
    agg: max
    expr: started_at
    description: Latest subscription started_at.
    agg_time_dimension: started_at
metrics:
- name: churn_rate
  label: Churn Rate
  description: Cancelled-subscription MRR share of total MRR (raw 0-1 ratio, not a percentage). MetricFlow
    approximation of variant B revenue churn. No period-anchored start-cohort denominator, no is_test
    exclusion.
  type: ratio
  type_params:
    numerator:
      name: cancelled_mrr_sum
      filter: '{{ Dimension(''subscription__status'') }} = ''cancelled'''
    denominator:
      name: all_subscription_mrr_sum
- name: cancelled_mrr_sum
  label: Cancelled Mrr Sum
  description: Building-block metric for churn_rate ratio.
  type: simple
  type_params:
    measure:
      name: cancelled_mrr_sum
      filter: '{{ Dimension(''subscription__status'') }} = ''cancelled'''
- name: all_subscription_mrr_sum
  label: All Subscription Mrr Sum
  description: Building-block metric for churn_rate ratio.
  type: simple
  type_params:
    measure:
      name: all_subscription_mrr_sum
