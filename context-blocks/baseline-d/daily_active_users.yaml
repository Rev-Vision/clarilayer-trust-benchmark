# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: daily_active_users (Daily Active Users (DAU))
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: A - 'Naive UTC day bucket on last_active_at'
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: customers
  description: Customer dimension — one row per customer account, including company metadata, signup,
    churn, and test flag.
  model: stg_customers
  defaults:
    agg_time_dimension: signup_date
  entities:
  - name: customer
    type: primary
    expr: customer_id
    description: Canonical customer entity.
  dimensions:
  - name: company_name
    type: categorical
    expr: company_name
    description: Account display name.
  - name: industry
    type: categorical
    expr: industry
    description: Customer industry vertical (free-text taxonomy).
  - name: plan_tier
    type: categorical
    expr: plan_tier
    description: Subscription plan tier on the customer record (Starter / Pro / Enterprise).
  - name: country
    type: categorical
    expr: country
    description: Customer billing country (ISO-style display value).
  - name: is_test
    type: categorical
    expr: is_test
    description: True for internal / QA accounts that should be excluded from financial roll-ups.
  - name: signup_date
    type: time
    expr: signup_date
    description: Date the customer first signed up.
    type_params:
      time_granularity: day
  - name: churned_at
    type: time
    expr: churned_at
    description: Timestamp the customer churned (NULL if still active).
    type_params:
      time_granularity: day
  measures:
  - name: customer_count
    agg: count_distinct
    expr: customer_id
    description: Distinct customer_id count.
  - name: first_signup_date
    agg: min
    expr: signup_date
    description: Earliest signup_date in the slice.
    agg_time_dimension: signup_date
  - name: last_signup_date
    agg: max
    expr: signup_date
    description: Latest signup_date in the slice.
    agg_time_dimension: signup_date
- name: users
  description: User dimension — one row per end-user; users belong to customers via customer_id.
  model: stg_users
  defaults:
    agg_time_dimension: created_at
  entities:
  - name: user
    type: primary
    expr: user_id
    description: Canonical user entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers — the user's account.
  dimensions:
  - name: email
    type: categorical
    expr: email
    description: User email address.
  - name: role
    type: categorical
    expr: role
    description: User role within the account (admin / editor / viewer).
  - name: created_at
    type: time
    expr: created_at
    description: Timestamp the user record was created.
    type_params:
      time_granularity: day
  - name: last_active_at
    type: time
    expr: last_active_at
    description: Timestamp of the user's most recent activity (UTC).
    type_params:
      time_granularity: day
  - name: deleted_at
    type: time
    expr: deleted_at
    description: Soft-delete timestamp (NULL if active).
    type_params:
      time_granularity: day
  measures:
  - name: daily_active_users
    description: Distinct user_id count keyed by last_active_at day bucket.
    agg: count_distinct
    expr: user_id
    agg_time_dimension: last_active_at
  - name: user_count
    agg: count_distinct
    expr: user_id
    description: Distinct user_id count.
  - name: last_active_at_max
    agg: max
    expr: last_active_at
    description: Maximum last_active_at across the slice.
    agg_time_dimension: last_active_at
- name: subscriptions
  description: Subscription fact — one row per subscription term with plan, MRR, status, and lifecycle
    timestamps.
  model: stg_subscriptions
  defaults:
    agg_time_dimension: started_at
  entities:
  - name: subscription
    type: primary
    expr: sub_id
    description: Canonical subscription-term entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: plan
    type: categorical
    expr: plan
    description: Subscription plan name.
  - name: status
    type: categorical
    expr: status
    description: Subscription status (active / cancelled / paused / trial).
  - name: started_at
    type: time
    expr: started_at
    description: Timestamp the subscription term began.
    type_params:
      time_granularity: day
  - name: ended_at
    type: time
    expr: ended_at
    description: Timestamp the subscription term ended (NULL if open).
    type_params:
      time_granularity: day
  measures:
  - name: total_mrr
    agg: sum
    expr: mrr
    description: Unfiltered SUM(mrr); compose with a status / is_test filter at the metric layer when
      scoping is required.
  - name: avg_mrr
    agg: average
    expr: mrr
    description: AVG(mrr) over the slice.
  - name: first_started_at
    agg: min
    expr: started_at
    description: Earliest subscription started_at.
    agg_time_dimension: started_at
  - name: last_started_at
    agg: max
    expr: started_at
    description: Latest subscription started_at.
    agg_time_dimension: started_at
- name: events
  description: Event fact — product/sales activity events with JSON properties; ties back to user and
    customer.
  model: stg_events
  defaults:
    agg_time_dimension: event_timestamp
  entities:
  - name: event
    type: primary
    expr: event_id
    description: Canonical event entity.
  - name: user
    type: foreign
    expr: user_id
    description: FK to dim_users.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers (denormalized).
  dimensions:
  - name: event_type
    type: categorical
    expr: event_type
    description: Event taxonomy key (login / opp_* / lead_qualified / etc.).
  - name: timezone
    type: categorical
    expr: timezone
    description: Source timezone label captured at ingest (mixed across rows).
  - name: event_timestamp
    type: time
    expr: event_timestamp
    description: Event occurrence timestamp.
    type_params:
      time_granularity: day
  - name: inserted_at
    type: time
    expr: inserted_at
    description: Warehouse insertion timestamp (UTC).
    type_params:
      time_granularity: day
  measures:
  - name: event_count
    agg: count
    expr: '1'
    description: Row-count measure across events.
metrics:
- name: daily_active_users
  label: Daily Active Users (DAU)
  description: Distinct user_ids per day from last_active_at. No timezone normalization, no subscription
    gate.
  type: simple
  type_params:
    measure:
      name: daily_active_users
saved_queries:
- name: daily_active_users_rollup
  description: Daily DAU rollup keyed on dim_users.last_active_at.
  query_params:
    metrics:
    - daily_active_users
    group_by:
    - TimeDimension('user__last_active_at', 'day')
