# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: gross_margin (Gross Margin)
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: B - '(Revenue - 25% COGS) / Revenue, raw invoices (no test exclusion)'
# Variant B uses a 25% COGS placeholder rather than reading fct_cogs;
# encoded as a `derived` metric so the percentage transformation is
# explicit at the metric layer.
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: customers
  description: Customer dimension — one row per customer account, including company metadata, signup,
    churn, and test flag.
  model: stg_customers
  defaults:
    agg_time_dimension: signup_date
  entities:
  - name: customer
    type: primary
    expr: customer_id
    description: Canonical customer entity.
  dimensions:
  - name: company_name
    type: categorical
    expr: company_name
    description: Account display name.
  - name: industry
    type: categorical
    expr: industry
    description: Customer industry vertical (free-text taxonomy).
  - name: plan_tier
    type: categorical
    expr: plan_tier
    description: Subscription plan tier on the customer record (Starter / Pro / Enterprise).
  - name: country
    type: categorical
    expr: country
    description: Customer billing country (ISO-style display value).
  - name: is_test
    type: categorical
    expr: is_test
    description: True for internal / QA accounts; governed metrics MUST exclude is_test = true.
  - name: signup_date
    type: time
    expr: signup_date
    description: Date the customer first signed up.
    type_params:
      time_granularity: day
  - name: churned_at
    type: time
    expr: churned_at
    description: Timestamp the customer churned (NULL if still active).
    type_params:
      time_granularity: day
  measures:
  - name: customer_count
    agg: count_distinct
    expr: customer_id
    description: Distinct customer_id count.
  - name: first_signup_date
    agg: min
    expr: signup_date
    description: Earliest signup_date in the slice.
    agg_time_dimension: signup_date
  - name: last_signup_date
    agg: max
    expr: signup_date
    description: Latest signup_date in the slice.
    agg_time_dimension: signup_date
- name: subscriptions
  description: Subscription fact — one row per subscription term with plan, MRR, status, and lifecycle
    timestamps.
  model: stg_subscriptions
  defaults:
    agg_time_dimension: started_at
  entities:
  - name: subscription
    type: primary
    expr: sub_id
    description: Canonical subscription-term entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: plan
    type: categorical
    expr: plan
    description: Subscription plan name.
  - name: status
    type: categorical
    expr: status
    description: Subscription status (active / cancelled / paused / trial).
  - name: started_at
    type: time
    expr: started_at
    description: Timestamp the subscription term began.
    type_params:
      time_granularity: day
  - name: ended_at
    type: time
    expr: ended_at
    description: Timestamp the subscription term ended (NULL if open).
    type_params:
      time_granularity: day
  measures:
  - name: total_mrr
    agg: sum
    expr: mrr
    description: Unfiltered SUM(mrr); pair with a filter for governed views.
  - name: avg_mrr
    agg: average
    expr: mrr
    description: AVG(mrr) over the slice.
  - name: first_started_at
    agg: min
    expr: started_at
    description: Earliest subscription started_at.
    agg_time_dimension: started_at
  - name: last_started_at
    agg: max
    expr: started_at
    description: Latest subscription started_at.
    agg_time_dimension: started_at
- name: invoices
  description: Invoice fact — one row per invoice with amount, status, and processor lineage.
  model: stg_invoices
  defaults:
    agg_time_dimension: paid_at
  entities:
  - name: invoice
    type: primary
    expr: invoice_id
    description: Canonical invoice entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers.
  dimensions:
  - name: status
    type: categorical
    expr: status
    description: Invoice status (paid / unpaid / void / refunded).
  - name: processor
    type: categorical
    expr: processor
    description: Payment processor (stripe / legacy_braintree).
  - name: paid_at
    type: time
    expr: paid_at
    description: Timestamp the invoice was paid (NULL if unpaid). Available granularities include the
      fiscal_month custom grain declared on the time spine.
    type_params:
      time_granularity: day
  - name: due_at
    type: time
    expr: due_at
    description: Invoice due date.
    type_params:
      time_granularity: day
  measures:
  - name: paid_invoice_amount_sum
    description: SUM(amount) over paid invoices.
    agg: sum
    expr: amount
  - name: total_amount
    agg: sum
    expr: amount
    description: Unfiltered SUM(amount); compose with status='paid' for revenue views.
  - name: avg_invoice_amount
    agg: average
    expr: amount
    description: AVG(amount) over the slice.
- name: cogs
  description: Cost of goods sold ledger — one row per source per month for COGS attribution.
  model: stg_cogs
  defaults:
    agg_time_dimension: period_month
  entities:
  - name: cogs_entry
    type: primary
    expr: concat(cast(period_month as varchar), '|', source)
    description: Composite (period_month, source) ledger key.
  dimensions:
  - name: source
    type: categorical
    expr: source
    description: COGS attribution bucket (cost_of_revenue / cost_of_goods_sold).
  - name: period_month
    type: time
    expr: period_month
    description: Month the cost was booked (first-of-month).
    type_params:
      time_granularity: month
  measures:
  - name: total_cogs
    agg: sum
    expr: amount
    description: SUM(amount) over COGS rows.
metrics:
- name: gross_margin
  label: Gross Margin %
  description: Revenue minus 25% COGS placeholder over paid invoices. No is_test exclusion. Variant B
    in the metric catalog.
  type: derived
  type_params:
    expr: (paid_invoice_amount_sum - paid_invoice_amount_sum * 0.25) / nullif(paid_invoice_amount_sum,
      0) * 100
    metrics:
    - name: paid_invoice_amount_sum
      filter: '{{ Dimension(''invoice__status'') }} = ''paid'''
- name: paid_invoice_amount_sum
  label: Paid Invoice Amount Sum
  description: Building-block metric for gross_margin derived expression.
  type: simple
  type_params:
    measure:
      name: paid_invoice_amount_sum
      filter: '{{ Dimension(''invoice__status'') }} = ''paid'''
