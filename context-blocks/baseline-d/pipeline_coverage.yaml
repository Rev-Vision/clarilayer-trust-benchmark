# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: pipeline_coverage (Pipeline Coverage)
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: A - 'Sum of all opp deal values / target'
# MetricFlow can't express NOT EXISTS over follow-up events; naive
# author sums all opp_created deal_values from properties_jsonb and
# divides by the placeholder $5M target.
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: events
  description: Event fact — product/sales activity events with JSON properties; ties back to user and
    customer.
  model: stg_events
  defaults:
    agg_time_dimension: event_timestamp
  entities:
  - name: event
    type: primary
    expr: event_id
    description: Canonical event entity.
  - name: user
    type: foreign
    expr: user_id
    description: FK to dim_users.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers (denormalized).
  dimensions:
  - name: event_type
    type: categorical
    expr: event_type
    description: Event taxonomy key (login / opp_* / lead_qualified / etc.).
  - name: timezone
    type: categorical
    expr: timezone
    description: Source timezone label captured at ingest (mixed across rows).
  - name: event_timestamp
    type: time
    expr: event_timestamp
    description: Event occurrence timestamp.
    type_params:
      time_granularity: day
  - name: inserted_at
    type: time
    expr: inserted_at
    description: Warehouse insertion timestamp (UTC).
    type_params:
      time_granularity: day
  measures:
  - name: opp_deal_value_sum
    description: SUM of opp_created deal_value JSON-path over events.
    agg: sum
    expr: cast(properties_jsonb->>'deal_value' as numeric)
  - name: event_count
    agg: count
    expr: '1'
    description: Row-count measure across events.
metrics:
- name: pipeline_coverage
  label: Pipeline Coverage
  description: All opp_created deal values divided by $5M target. No open-status NOT EXISTS filter, no
    JSON-path coalesce — a competent dbt author would not catch the camelCase form.
  type: derived
  type_params:
    expr: opp_deal_value_sum / 5000000.0
    metrics:
    - name: opp_deal_value_sum
      filter: '{{ Dimension(''event__event_type'') }} = ''opp_created'''
- name: opp_deal_value_sum
  label: Opp Deal Value Sum
  description: Building-block metric for pipeline_coverage derived expression.
  type: simple
  type_params:
    measure:
      name: opp_deal_value_sum
      filter: '{{ Dimension(''event__event_type'') }} = ''opp_created'''
