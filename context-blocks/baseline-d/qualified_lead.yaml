# ClariLayer Trust Benchmark - Baseline D (dbt MetricFlow semantic layer)
# Metric: qualified_lead (Qualified Lead)
# Generated by benchmark/scripts/build_context_blocks.py - do not edit by hand.
#
# Variant lifted into MetricFlow metric: A (approximated) - 'Distinct users with a lead_qualified event in window'
# MetricFlow cannot natively express NOT EXISTS / engagement-threshold
# gates via a JOIN-based ratio; this approximation counts distinct users
# with a lead_qualified event but drops the engagement-threshold and
# industry filters — the kind of gap a competent semantic-layer engineer
# ships without governance context.
# Note: ONE canonical metric definition per file. NO governance metadata,
# NO metric versioning, NO deprecated variants, NO fiscal-calendar override -
# this is the dbt MetricFlow sibling of Baseline C, scoped to the same
# 'expert-grade non-governed' surface.
# Time spine: time_spine model with day grain (custom: fiscal_month) lives at
# benchmark/dbt_project/models/marts/_time_spine.yml.
# Adequacy checklist: ./adequacy-checklist.md (dbt-metricflow docs anchors per primitive).
semantic_models:
- name: customers
  description: Customer dimension — one row per customer account, including company metadata, signup,
    churn, and test flag.
  model: stg_customers
  defaults:
    agg_time_dimension: signup_date
  entities:
  - name: customer
    type: primary
    expr: customer_id
    description: Canonical customer entity.
  dimensions:
  - name: company_name
    type: categorical
    expr: company_name
    description: Account display name.
  - name: industry
    type: categorical
    expr: industry
    description: Customer industry vertical (free-text taxonomy).
  - name: plan_tier
    type: categorical
    expr: plan_tier
    description: Subscription plan tier on the customer record (Starter / Pro / Enterprise).
  - name: country
    type: categorical
    expr: country
    description: Customer billing country (ISO-style display value).
  - name: is_test
    type: categorical
    expr: is_test
    description: True for internal / QA accounts that should be excluded from financial roll-ups.
  - name: signup_date
    type: time
    expr: signup_date
    description: Date the customer first signed up.
    type_params:
      time_granularity: day
  - name: churned_at
    type: time
    expr: churned_at
    description: Timestamp the customer churned (NULL if still active).
    type_params:
      time_granularity: day
  measures:
  - name: customer_count
    agg: count_distinct
    expr: customer_id
    description: Distinct customer_id count.
  - name: first_signup_date
    agg: min
    expr: signup_date
    description: Earliest signup_date in the slice.
    agg_time_dimension: signup_date
  - name: last_signup_date
    agg: max
    expr: signup_date
    description: Latest signup_date in the slice.
    agg_time_dimension: signup_date
- name: users
  description: User dimension — one row per end-user; users belong to customers via customer_id.
  model: stg_users
  defaults:
    agg_time_dimension: created_at
  entities:
  - name: user
    type: primary
    expr: user_id
    description: Canonical user entity.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers — the user's account.
  dimensions:
  - name: email
    type: categorical
    expr: email
    description: User email address.
  - name: role
    type: categorical
    expr: role
    description: User role within the account (admin / editor / viewer).
  - name: created_at
    type: time
    expr: created_at
    description: Timestamp the user record was created.
    type_params:
      time_granularity: day
  - name: last_active_at
    type: time
    expr: last_active_at
    description: Timestamp of the user's most recent activity (UTC).
    type_params:
      time_granularity: day
  - name: deleted_at
    type: time
    expr: deleted_at
    description: Soft-delete timestamp (NULL if active).
    type_params:
      time_granularity: day
  measures:
  - name: user_count
    agg: count_distinct
    expr: user_id
    description: Distinct user_id count.
  - name: last_active_at_max
    agg: max
    expr: last_active_at
    description: Maximum last_active_at across the slice.
    agg_time_dimension: last_active_at
- name: events
  description: Event fact — product/sales activity events with JSON properties; ties back to user and
    customer.
  model: stg_events
  defaults:
    agg_time_dimension: event_timestamp
  entities:
  - name: event
    type: primary
    expr: event_id
    description: Canonical event entity.
  - name: user
    type: foreign
    expr: user_id
    description: FK to dim_users.
  - name: customer
    type: foreign
    expr: customer_id
    description: FK to dim_customers (denormalized).
  dimensions:
  - name: event_type
    type: categorical
    expr: event_type
    description: Event taxonomy key (login / opp_* / lead_qualified / etc.).
  - name: timezone
    type: categorical
    expr: timezone
    description: Source timezone label captured at ingest (mixed across rows).
  - name: event_timestamp
    type: time
    expr: event_timestamp
    description: Event occurrence timestamp.
    type_params:
      time_granularity: day
  - name: inserted_at
    type: time
    expr: inserted_at
    description: Warehouse insertion timestamp (UTC).
    type_params:
      time_granularity: day
  measures:
  - name: qualified_leads
    description: Distinct user_ids with a lead_qualified event in the window. No engagement-threshold
      or industry filter — too complex for a single MetricFlow measure.
    agg: count_distinct
    expr: user_id
  - name: event_count
    agg: count
    expr: '1'
    description: Row-count measure across events.
metrics:
- name: qualified_leads
  label: Qualified Leads
  description: Distinct users with a lead_qualified event in the window. No engagement-threshold or industry
    filter — those are too complex for a single MetricFlow measure.
  type: simple
  type_params:
    measure:
      name: qualified_leads
      filter: '{{ Dimension(''event__event_type'') }} = ''lead_qualified'''
