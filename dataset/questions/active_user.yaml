- id: active_user-004
  metric_key: active_user
  governed_variant: C
  question: "What was the month-over-month change in active users from February 2026 to March 2026?"
  expected_sql: |
    WITH mar AS (
      SELECT COUNT(DISTINCT u.user_id) AS au
      FROM dim_users u
      JOIN fct_subscriptions s ON s.customer_id = u.customer_id
      JOIN dim_customers c ON c.customer_id = u.customer_id
      WHERE u.last_active_at >= TIMESTAMP '2026-03-01'
        AND u.last_active_at < TIMESTAMP '2026-04-01'
        AND s.status = 'active' AND s.mrr > 0 AND s.started_at < TIMESTAMP '2026-04-01'
        AND (s.ended_at IS NULL OR s.ended_at >= TIMESTAMP '2026-03-01')
        AND c.is_test = false AND u.deleted_at IS NULL
    ),
    feb AS (
      SELECT COUNT(DISTINCT u.user_id) AS au
      FROM dim_users u
      JOIN fct_subscriptions s ON s.customer_id = u.customer_id
      JOIN dim_customers c ON c.customer_id = u.customer_id
      WHERE u.last_active_at >= TIMESTAMP '2026-02-01'
        AND u.last_active_at < TIMESTAMP '2026-03-01'
        AND s.status = 'active' AND s.mrr > 0 AND s.started_at < TIMESTAMP '2026-03-01'
        AND (s.ended_at IS NULL OR s.ended_at >= TIMESTAMP '2026-02-01')
        AND c.is_test = false AND u.deleted_at IS NULL
    )
    SELECT mar.au - feb.au AS mom_change FROM mar, feb
  expected_value: 20827
  acceptable_alternatives:
    - "Two governed-variant queries with the difference computed in any equivalent shape."
  unacceptable_variants:
    - "MoM computed using variant A or B (different active definitions yield different absolute numbers and so a different delta)."
  difficulty: hard
  ambiguity_axis: trend

