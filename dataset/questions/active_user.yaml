# Test questions for active_user.
# Governed variant: C — distinct users with non-stale last_active_at in
# window AND on a paying-customer (active subscription with mrr > 0)
# AND non-test customer AND not soft-deleted. The mrr > 0 predicate
# excludes refund-row subs whose negative mrr can otherwise carry an
# 'active' status from the billing system.

- id: active_user-001
  metric_key: active_user
  governed_variant: C
  question: "How many active users did we have in March 2026?"
  expected_sql: |
    SELECT COUNT(DISTINCT u.user_id)
    FROM dim_users u
    JOIN fct_subscriptions s ON s.customer_id = u.customer_id
    JOIN dim_customers c ON c.customer_id = u.customer_id
    WHERE u.last_active_at >= TIMESTAMP '2026-03-01'
      AND u.last_active_at < TIMESTAMP '2026-04-01'
      AND s.status = 'active'
      AND s.mrr > 0
      AND s.started_at < TIMESTAMP '2026-04-01'
      AND (s.ended_at IS NULL OR s.ended_at >= TIMESTAMP '2026-03-01')
      AND c.is_test = false
      AND u.deleted_at IS NULL
  expected_value: 32931
  acceptable_alternatives:
    - "Equivalent SQL with the same last_active_at + paying-customer (mrr > 0) + non-test + non-deleted filters."
  unacceptable_variants:
    - "A — last_active_at only, no subscription / test / deletion filters"
    - "B — event-trigger based ('login' or 'action_performed'); excludes broader pulse signals"
    - "D — session-based heuristic; fragile against TZ-mixed timestamps"
    - "E — engaged threshold (≥5 events); produces conservative under-count"
    - "Variants without mrr > 0 — overcount users tied to refund-row subs"
  difficulty: easy
  ambiguity_axis: definition

