- id: arr_contraction-004
  metric_key: arr_contraction
  governed_variant: B
  question: "How does our existing-customer contraction in Q1 2026 compare to ARR Expansion in the same period?"
  expected_sql: |
    -- Compute Contraction (governed) for Q1 2026 — the comparison
    -- denominator (Expansion) is exposed via the related metric;
    -- the question asks for Contraction itself.
    WITH cust_period AS (
      SELECT
        c.customer_id,
        SUM(CASE
              WHEN s.started_at < TIMESTAMP '2026-01-01'
                AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-01-01')
                AND s.mrr > 0
              THEN s.mrr ELSE 0 END) AS arr_start,
        SUM(CASE
              WHEN s.started_at < TIMESTAMP '2026-04-01'
                AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-04-01')
                AND s.mrr > 0
              THEN s.mrr ELSE 0 END) AS arr_end
      FROM dim_customers c
      LEFT JOIN fct_subscriptions s ON s.customer_id = c.customer_id
      WHERE c.is_test = false
        AND c.signup_date < DATE '2026-01-01'
      GROUP BY c.customer_id
    )
    SELECT SUM(GREATEST(arr_start - arr_end, 0)) * 12 AS arr_contraction
    FROM cust_period
    WHERE arr_start > 0
  expected_value: 3167570.40
  acceptable_alternatives:
    - "Equivalent governed-variant Contraction SQL for Q1 2026."
  unacceptable_variants:
    - "Variant E — suppressed by historical-period status filter + survivorship."
    - "Variant A — picks up negative MRR refund rows."
  difficulty: hard
  ambiguity_axis: definition
