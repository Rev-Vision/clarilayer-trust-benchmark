- id: bookings-005
  metric_key: bookings
  governed_variant: B
  question: "Compare February 2026 bookings to March 2026 bookings — what was the change?"
  expected_sql: |
    WITH mar AS (
      SELECT SUM(s.mrr * 12) AS bookings FROM fct_subscriptions s
      JOIN dim_customers c ON c.customer_id = s.customer_id
      WHERE s.started_at >= TIMESTAMP '2026-03-01'
        AND s.started_at < TIMESTAMP '2026-04-01'
        AND s.mrr > 0 AND c.is_test = false
    ),
    feb AS (
      SELECT SUM(s.mrr * 12) AS bookings FROM fct_subscriptions s
      JOIN dim_customers c ON c.customer_id = s.customer_id
      WHERE s.started_at >= TIMESTAMP '2026-02-01'
        AND s.started_at < TIMESTAMP '2026-03-01'
        AND s.mrr > 0 AND c.is_test = false
    )
    SELECT mar.bookings - feb.bookings AS mom_change FROM mar, feb
  expected_value: 585102.36
  acceptable_alternatives:
    - "Two governed-variant period queries with the difference computed in any equivalent shape."
  unacceptable_variants:
    - "MoM computed using cash-basis bookings (variant C)."
    - "MoM that excludes expansion (variant D — new-logo-only) on either side."
  difficulty: hard
  ambiguity_axis: trend
