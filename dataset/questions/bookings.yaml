# Test questions for bookings.
# Governed variant: B — annualized contract value (mrr × 12) of subs that
# started in the period, excluding test customers and refund-accounting
# negative-MRR rows. Window is on subscription started_at, not paid_at.

- id: bookings-001
  metric_key: bookings
  governed_variant: B
  question: "What were our bookings in Q1 2026?"
  expected_sql: |
    SELECT SUM(s.mrr * 12) AS bookings
    FROM fct_subscriptions s
    JOIN dim_customers c ON c.customer_id = s.customer_id
    WHERE s.started_at >= TIMESTAMP '2026-01-01'
      AND s.started_at < TIMESTAMP '2026-04-01'
      AND s.mrr > 0
      AND c.is_test = false
  expected_value: 14373147.24
  acceptable_alternatives:
    - "Equivalent SQL with the same started_at window plus governed filters."
  unacceptable_variants:
    - "A — SUM(mrr) without the ×12 annualization (off by 12x)"
    - "C — invoice-due-date instead of subscription start (cash basis)"
    - "D — new-logo-only bookings (excludes expansion bookings)"
    - "E — includes negative-MRR refund rows"
  difficulty: easy
  ambiguity_axis: definition

