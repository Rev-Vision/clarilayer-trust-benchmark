- id: customer-005
  metric_key: customer
  governed_variant: B
  question: "How many customers did we add in Q1 2026 who are currently active paying customers?"
  expected_sql: |
    -- "Currently active paying" applies the governed Customer filter
    -- set (active subscription, mrr>0, non-test, non-churned). The
    -- "added in Q1" restricts the cohort by signup_date.
    SELECT COUNT(DISTINCT c.customer_id) AS customers
    FROM dim_customers c
    JOIN fct_subscriptions s ON s.customer_id = c.customer_id
    WHERE c.signup_date >= DATE '2026-01-01'
      AND c.signup_date < DATE '2026-04-01'
      AND c.is_test = false
      AND c.churned_at IS NULL
      AND s.status = 'active'
      AND s.mrr > 0
  expected_value: 192
  acceptable_alternatives:
    - "Equivalent SQL filtering signup_date in Q1 plus governed Customer filters."
  unacceptable_variants:
    - "Counting all signups including test + free + churned (variant A)."
    - "Counting customers as of any signup without a paid-subscription gate (variant C)."
  difficulty: medium
  ambiguity_axis: filter

- id: customer-006
  metric_key: customer
  governed_variant: B
  question: "How many distinct paying customers do we have right now? Use the canonical customer identifier."
  expected_sql: |
    -- The governed Customer-grain key is dim_customers.customer_id.
    -- Other tables and legacy columns carry alternative spellings:
    -- dim_customers.cust_id (sparse legacy import, ~50% populated),
    -- dim_users.account_id (per-user spelling, ~40% populated),
    -- fct_subscriptions.cust_id (sporadic). Using any of those
    -- alternatives produces a different and materially smaller count.
    SELECT COUNT(DISTINCT c.customer_id) AS customers
    FROM dim_customers c
    JOIN fct_subscriptions s ON s.customer_id = c.customer_id
    WHERE c.is_test = false
      AND c.churned_at IS NULL
      AND s.status = 'active'
      AND s.mrr > 0
  expected_value: 7572
  acceptable_alternatives:
    - "Equivalent SQL using dim_customers.customer_id as the canonical key plus governed paying-non-test-non-churned filters."
  unacceptable_variants:
    - "COUNT(DISTINCT cust_id) FROM dim_customers — uses the sparse legacy column; returns a much smaller number."
    - "COUNT(DISTINCT account_id) FROM dim_users with the same filters — different dimension entirely (per-user account spelling)."
    - "Variants A/C/D/E from the metric catalog."
  difficulty: medium
  ambiguity_axis: naming
