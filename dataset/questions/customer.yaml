# Test questions for customer.
# Governed variant: B — distinct paying, non-test, non-churned customers
# with at least one currently-active paid subscription as-of the date.

- id: customer-001
  metric_key: customer
  governed_variant: B
  question: "How many customers do we have as of March 31, 2026?"
  expected_sql: |
    SELECT COUNT(DISTINCT c.customer_id) AS customers
    FROM dim_customers c
    JOIN fct_subscriptions s ON s.customer_id = c.customer_id
    WHERE c.is_test = false
      AND c.churned_at IS NULL
      AND s.status = 'active'
      AND s.mrr > 0
      AND s.started_at <= TIMESTAMP '2026-03-31'
      AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-03-31')
  expected_value: 7448
  acceptable_alternatives:
    - "Equivalent SQL with the same paying-non-test-non-churned filter set."
  unacceptable_variants:
    - "A — COUNT(*) FROM dim_customers (includes test, churned, near-duplicates; ~10-15% over)"
    - "C — non-test, non-churned with no subscription gate (includes free/trial/paused; ~20-30% over)"
    - "D — last-30d-engagement; product-led definition, not revenue-aligned"
    - "E — deduplicated by company_name; collapses parent-subsidiaries"
  difficulty: easy
  ambiguity_axis: definition

- id: customer-002
  metric_key: customer
  governed_variant: B
  question: "How many customers did we have at the end of fiscal year 2025?"
  expected_sql: |
    -- Fiscal year 2025 ends 2025-12-31 per governance metadata.
    SELECT COUNT(DISTINCT c.customer_id) AS customers
    FROM dim_customers c
    JOIN fct_subscriptions s ON s.customer_id = c.customer_id
    WHERE c.is_test = false
      AND c.churned_at IS NULL
      AND s.status = 'active'
      AND s.mrr > 0
      AND s.started_at <= TIMESTAMP '2025-12-31'
      AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2025-12-31')
  expected_value: 4731
  acceptable_alternatives:
    - "Equivalent governed-variant SQL on December-31 as-of."
  unacceptable_variants:
    - "Variants A/C/D/E."
    - "Mid-year as-of (June or other) misinterpreting fiscal year."
  difficulty: medium
  ambiguity_axis: time_logic

- id: customer-003
  metric_key: customer
  governed_variant: B
  question: "How many SaaS-industry customers do we have as of March 31, 2026?"
  expected_sql: |
    -- Industry filter must normalize the free-text/coded-enum mix
    -- (e.g., 'saas' / 'SaaS' / 'B2B SaaS' / 'Software-as-a-Service'
    -- all collapse to 'saas' per the qualified_lead governed pattern).
    SELECT COUNT(DISTINCT c.customer_id) AS customers
    FROM dim_customers c
    JOIN fct_subscriptions s ON s.customer_id = c.customer_id
    WHERE c.is_test = false
      AND c.churned_at IS NULL
      AND s.status = 'active'
      AND s.mrr > 0
      AND s.started_at <= TIMESTAMP '2026-03-31'
      AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-03-31')
      AND (
        CASE
          WHEN LOWER(TRIM(c.industry)) IN ('saas', 'software-as-a-service', 'b2b saas', 'b2b-saas') THEN 'saas'
          ELSE LOWER(TRIM(c.industry))
        END
      ) = 'saas'
  expected_value: 1975
  acceptable_alternatives:
    - "Equivalent SQL that LOWER+TRIMs the industry column and collapses the saas variants ('saas', 'SaaS', 'Software-as-a-Service', 'b2b saas', 'B2B-SaaS')."
  unacceptable_variants:
    - "industry IN ('saas') only — misses ~30%+ of qualifying rows."
    - "industry = 'SaaS' or any single-form match."
    - "Variants that drop the paying-subscription gate."
  difficulty: hard
  ambiguity_axis: filter

