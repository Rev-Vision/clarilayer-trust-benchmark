# Test questions for mrr (Monthly Recurring Revenue).
# Governed variant: C — same active/non-test/non-churned/positive-MRR
# subscription gate as ARR but reported at the period-end as-of date,
# without the ×12 annualization.
#
# Ambiguity coverage:
#   - definition (which variant; refund / test / status filters)
#   - time logic (period-end as-of vs "right now")
#   - grouping (by tier)
#   - trend (MoM)
#   - filter (cash basis vs subscription book)

- id: mrr-001
  metric_key: mrr
  governed_variant: C
  question: "What was our MRR at the end of March 2026?"
  expected_sql: |
    SELECT SUM(s.mrr) AS mrr
    FROM fct_subscriptions s
    JOIN dim_customers c ON c.customer_id = s.customer_id
    WHERE s.status = 'active'
      AND s.started_at <= TIMESTAMP '2026-03-31'
      AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-03-31')
      AND s.mrr > 0
      AND c.is_test = false
      AND c.churned_at IS NULL
  expected_value: 2037836.75
  acceptable_alternatives:
    - "Equivalent SQL with the same filter conjunction returning the same SUM(mrr)."
  unacceptable_variants:
    - "A — SUM(mrr) WHERE status='active' (no test/churn/refund filters; ~7-9% inflation)"
    - "B — adds date-window check but still includes test/refund inflation"
    - "D — cash-billed (invoice-based) MRR; conflates run-rate with cash receipts"
  difficulty: easy
  ambiguity_axis: definition

