- id: mrr-004
  metric_key: mrr
  governed_variant: C
  question: "What was the month-over-month MRR change between January 2026 and February 2026?"
  expected_sql: |
    WITH feb AS (
      SELECT SUM(s.mrr) AS mrr FROM fct_subscriptions s
      JOIN dim_customers c ON c.customer_id = s.customer_id
      WHERE s.status = 'active'
        AND s.started_at <= TIMESTAMP '2026-02-28'
        AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-02-28')
        AND s.mrr > 0 AND c.is_test = false AND c.churned_at IS NULL
    ),
    jan AS (
      SELECT SUM(s.mrr) AS mrr FROM fct_subscriptions s
      JOIN dim_customers c ON c.customer_id = s.customer_id
      WHERE s.status = 'active'
        AND s.started_at <= TIMESTAMP '2026-01-31'
        AND (s.ended_at IS NULL OR s.ended_at > TIMESTAMP '2026-01-31')
        AND s.mrr > 0 AND c.is_test = false AND c.churned_at IS NULL
    )
    SELECT feb.mrr - jan.mrr AS mom_change FROM feb, jan
  expected_value: 225652.89
  acceptable_alternatives:
    - "Two governed-variant snapshots and a delta in any equivalent shape."
  unacceptable_variants:
    - "MoM computed from variant A or D (no test/refund filter, or cash basis)."
  difficulty: hard
  ambiguity_axis: trend

