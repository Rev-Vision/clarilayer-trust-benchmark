# Test questions for revenue.
# Governed variant: B — paid invoices over period, non-test customers,
# with paid_at normalized from {legacy_braintree=America/New_York,
# else=UTC} into America/Los_Angeles before windowing.

- id: revenue-001
  metric_key: revenue
  governed_variant: B
  question: "What was our revenue in March 2026?"
  expected_sql: |
    SELECT SUM(i.amount) AS revenue
    FROM fct_invoices i
    JOIN dim_customers c ON c.customer_id = i.customer_id
    WHERE
      (CASE
        WHEN i.processor = 'legacy_braintree'
          THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
        ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
      END) >= TIMESTAMP '2026-03-01'
      AND (CASE
        WHEN i.processor = 'legacy_braintree'
          THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
        ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
      END) < TIMESTAMP '2026-04-01'
      AND i.status = 'paid'
      AND c.is_test = false
  expected_value: 776757.47
  acceptable_alternatives:
    - "Equivalent SQL with the same paid-status, non-test, timezone-normalized window."
  unacceptable_variants:
    - "A — SUM(amount) WHERE paid_at IN window (no status, no test filter; ~3-5% inflation; also no timezone normalization)"
    - "C — accrual-basis revenue from subscriptions"
    - "D — billings-style (paid_at OR due_at)"
    - "E — net of negative-MRR refunds (double-counts the refund offset)"
    - "Variants ignoring the legacy_braintree timezone (NY-wall-clock paid_at interpreted as UTC)."
  difficulty: easy
  ambiguity_axis: definition

