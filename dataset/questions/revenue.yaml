- id: revenue-006
  metric_key: revenue
  governed_variant: B
  question: "What was the month-over-month change in revenue from February 2026 to March 2026?"
  expected_sql: |
    WITH mar AS (
      SELECT SUM(i.amount) AS rev FROM fct_invoices i
      JOIN dim_customers c ON c.customer_id = i.customer_id
      WHERE
        (CASE
          WHEN i.processor = 'legacy_braintree'
            THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
          ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
        END) >= TIMESTAMP '2026-03-01'
        AND (CASE
          WHEN i.processor = 'legacy_braintree'
            THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
          ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
        END) < TIMESTAMP '2026-04-01'
        AND i.status = 'paid' AND c.is_test = false
    ),
    feb AS (
      SELECT SUM(i.amount) AS rev FROM fct_invoices i
      JOIN dim_customers c ON c.customer_id = i.customer_id
      WHERE
        (CASE
          WHEN i.processor = 'legacy_braintree'
            THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
          ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
        END) >= TIMESTAMP '2026-02-01'
        AND (CASE
          WHEN i.processor = 'legacy_braintree'
            THEN i.paid_at AT TIME ZONE 'America/New_York' AT TIME ZONE 'America/Los_Angeles'
          ELSE i.paid_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Los_Angeles'
        END) < TIMESTAMP '2026-03-01'
        AND i.status = 'paid' AND c.is_test = false
    )
    SELECT mar.rev - feb.rev AS mom_change FROM mar, feb
  expected_value: 77125.36
  acceptable_alternatives:
    - "Two governed-variant period queries with the difference in any equivalent shape."
  unacceptable_variants:
    - "MoM computed using variant A (no status / test / TZ filters) on either side; the TZ shift on the legacy_braintree subset alone moves the answer."
    - "MoM with paid_at interpreted as UTC universally."
  difficulty: hard
  ambiguity_axis: trend
